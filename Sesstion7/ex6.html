<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dental Progress Card</title>
    <link rel="stylesheet" href="ex6.css">
</head>

<body>

    <div class="card">
        <div class="card-header">
            <h2 class="title">Niềng răng chỉnh nha</h2>
            <span class="status-badge">ĐANG ĐIỀU TRỊ</span>
        </div>

        <div class="info-row">
            <span class="label">Bác sĩ 👤 :</span>
            <span class="value bold">BS. Nguyễn Minh Tâm</span>
        </div>

        <div class="info-row">
            <span class="label">Chi phí ⌨ :</span>
            <span class="value bold price">25.000.000 đ</span>
        </div>

         <!-- Tiến trình điều trị -->
        <div class="progress-section">
            <h3 class="progress-title">Tiến trình điều trị</h3>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" style="width: 75%;"></div>
            </div>
        </div>

        <div class="date-row">
            <span class="label">Bắt đầu:</span>
            <span class="value">10/03/2025</span>
        </div>

        <div class="date-row">
            <span class="label">Dự kiến hoàn thành:</span>
            <span class="value">10/03/2026</span>
        </div>
    </div>

</body>

</html>
