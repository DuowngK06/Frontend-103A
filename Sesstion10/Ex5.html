<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Món Nổi Bật</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2 class="title">Món Nổi Bật Hôm Nay</h2>

    <div class="food-layout">
        <!-- BIG -->
        <div class="card big">
            <img src="images/wagyu.jpg" alt="">
            <h3>Grilled Wagyu Beef Tenderloin</h3>
            <span class="price">1.200.000 ₫</span>
        </div>

        <!-- SMALL -->
        <div class="card small">
            <img src="images/scallop.jpg" alt="">
            <h3>Seared Scallops</h3>
            <span class="price">320.000 ₫</span>
        </div>

        <div class="card small">
            <img src="images/eggs.jpg" alt="">
            <h3>Truffle Deviled Eggs</h3>
            <span class="price">180.000 ₫</span>
        </div>

        <!-- ROW 2 -->
        <div class="card">
            <img src="images/lobster.jpg" alt="">
            <h3>Lobster Bisque</h3>
            <span class="price">420.000 ₫</span>
        </div>

        <div class="card">
            <img src="images/foiegras.jpg" alt="">
            <h3>Pan-Seared Foie Gras</h3>
            <span class="price">580.000 ₫</span>
        </div>
    </div>

</body>

</html>
