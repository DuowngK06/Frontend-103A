<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Course Card</title>
    <link rel="stylesheet" href="Ex2.css">
</head>

<body>

    <div class="course-card">
        <div class="card-top">
            <span class="badge">Bán chạy</span>
            <div class="icon">&lt;/&gt;</div>
        </div>

        <div class="card-body">
            <span class="tag">Lập trình</span>

            <div class="title-row">
                <h3>Lập trình Web Full Stack</h3>
                <div class="rating">⭐ 4.9</div>
            </div>

            <p class="desc">
                Học lập trình web từ cơ bản đến nâng cao với các công nghệ hiện đại nhất
            </p>

            <div class="info">
                <span>⏱ 40 giờ</span>
                <span>👥 12K+ học viên</span>
            </div>

            <div class="footer">
                <span class="price">2.990.000đ</span>
                <button class="btn">Xem chi tiết</button>
            </div>
        </div>
    </div>

</body>

</html>
