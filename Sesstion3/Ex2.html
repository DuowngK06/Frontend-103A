<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Form Đặt Mua Tài Liệu</title>
</head>

<body>

    <h1>Form Đặt Mua Tài Liệu Lập Trình</h1>

    <form>
        <p>
            Chọn tài liệu:
            <select name="tailieu">
                <option value="html-css">Tài liệu môn HTML&CSS</option>
                <option value="javascript">Tài liệu môn Javascript</option>
            </select>
        </p>

        <p>
            Số lượng: <input type="number" name="soluong" value="1">
        </p>

        <p>
            Ghi chú: <br>
            <textarea name="ghichu" rows="4" cols="30"></textarea>
        </p>

        <p>
            Địa chỉ giao hàng: <br>
            <textarea name="diachi" rows="4" cols="30"></textarea>
        </p>

        <p>
            <button type="submit">Đặt mua</button>
        </p>
    </form>

</body>

</html>
