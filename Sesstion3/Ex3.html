<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Thông tin sinh viên</title>
</head>

<body>

    <form>
        Họ và tên: <input type="text" name="ho_ten">
        <br><br>

        Email: <input type="email" name="email">
        <br><br>

        Ngày sinh: <input type="date" name="ngay_sinh">
        <br><br>

        Giới tính:
        <input type="radio" name="gioi_tinh" value="Nam"> Nam
        <input type="radio" name="gioi_tinh" value="Nữ"> Nữ
        <br><br>

        Số điện thoại: <input type="tel" name="sdt">
        <br><br>

        Chuyên ngành: <input type="text" name="chuyen_nganh">
        <br><br>

        Năm nhập học: <input type="number" name="nam_nhap_hoc">
        <br><br>

        Điểm GPA: <input type="text" name="gpa">
        <br><br>

        Địa chỉ: <textarea name="dia_chi_sv" rows="2" cols="40"></textarea>
        <br><br>

        Lớp học:
        <select name="lop">
            <option>Lớp 1</option>
            <option>Lớp 2</option>
        </select>
        <br><br>

        Ngày đăng ký học: <input type="datetime-local" name="ngay_dang_ky">
        <br><br>

        <input type="submit" value="Gửi thông tin">
    </form>

</body>

</html>
